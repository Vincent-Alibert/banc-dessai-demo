server {
    listen 80;
    server_name localhost;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; frame-ancestors 'self'" always;
    location = / {
        default_type text/plain;
        return 200 "Banc de simulation Noa\nRapport : /S01/rapport_v0.html (adapter le code de campagne)\nDocumentation dbt : /dbt/\n";
    }
    location ~ ^/S(0[1-9]|[1-9][0-9]+)/rapport_v0\.html$ {
        root /srv/runs;
        try_files $uri =404;
    }
    location /dbt/ {
        alias /srv/dbt/;
        index index.html;
        autoindex off;
    }
    location / { return 404; }
}
