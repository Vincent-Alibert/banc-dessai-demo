# CI du depot de demonstration : aucun secret ni appel payant ; actions epinglees par SHA pour une execution
# reproductible, mypy seul non bloquant.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          version: "0.12.9"

      - name: Configurer Python 3.12
        run: uv python install 3.12

      - name: Installer les dependances
        run: uv sync --frozen

      # Qualite : chaque controle tourne meme si un precedent a echoue (!cancelled), le job echoue s'il y en a un
      - name: Lint (ruff check)
        run: uv run --frozen poe lint

      - name: Format (ruff format --check)
        if: ${{ !cancelled() }}
        run: uv run --frozen poe format-check

      - name: Types (mypy, non bloquant)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: uv run --frozen poe mypy

      # Tests
      - name: Tests et couverture
        if: ${{ !cancelled() }}
        run: uv run --frozen poe test

      - name: Rapport de couverture (HTML, un jour)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: couverture-html
          path: htmlcov/
          retention-days: 1
          if-no-files-found: ignore

      # Securite
      - name: Dependances vulnerables (pip-audit)
        if: ${{ !cancelled() }}
        run: uv run --frozen poe security

      - name: Code Python (bandit, alertes hautes)
        if: ${{ !cancelled() }}
        run: uv run --frozen poe bandit
