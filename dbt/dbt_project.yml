name: banc
version: 1.0.0
config-version: 2
profile: banc
model-paths:
- models
test-paths:
- tests
macro-paths:
- macros
seed-paths:
- seeds
target-path: target
clean-targets:
- target
flags:
  send_anonymous_usage_stats: false
models:
  banc:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: staging
      +materialized: view
    etoile:
      +materialized: table
    vues:
      +materialized: view
seeds:
  banc:
    +schema: staging
    jeux_personas:
      +column_types:
        identifiant: text
        jeu: text
        source: text
tests:
  banc:
    +severity: error
